services:
  postgres:
    image: postgres:16-alpine
    container_name: meditrack-db
    environment:
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: meditrack_dev_password
      POSTGRES_DB: meditrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meditrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

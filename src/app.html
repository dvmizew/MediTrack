<!doctype html>
<html lang="ro">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		
		<!-- PWA Meta Tags -->
		<meta name="theme-color" content="#3b82f6" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="MediTrack" />
		<meta name="description" content="Aplicatie pentru gestionarea tratamentelor medicale si aderenta la medicatie" />
		
		<!-- PWA Icons -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
		
		<!-- Theme initialization script to prevent flash -->
		<script>
			(function() {
				const theme = localStorage.getItem('theme') || 
					(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				}
				// Set background immediately to prevent flash - use the primary dark color from gradient
				document.documentElement.style.backgroundColor = theme === 'dark' ? '#0f0f1a' : '#ffffff';
				
				// Load accessibility settings
				try {
					const accessibilitySettings = JSON.parse(localStorage.getItem('accessibility-settings') || '{}');
					
					// Apply text size
					const sizeMultipliers = { normal: 1, large: 1.25, xlarge: 1.5 };
					const multiplier = sizeMultipliers[accessibilitySettings.textSize] || 1;
					document.documentElement.style.fontSize = (16 * multiplier) + 'px';
					
					// Apply high contrast
					if (accessibilitySettings.highContrast) {
						document.documentElement.classList.add('high-contrast');
					}
					
					// Apply reduce motion
					if (accessibilitySettings.reduceMotion) {
						document.documentElement.classList.add('reduce-motion');
					}
				} catch (e) {}
			})();
		</script>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

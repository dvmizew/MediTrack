<!DOCTYPE html>
<html lang="ro">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Offline - MediTrack</title>
	<style>
		body {
			font-family: system-ui, -apple-system, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			text-align: center;
			padding: 20px;
		}
		.container {
			max-width: 400px;
		}
		h1 {
			font-size: 2rem;
			margin-bottom: 1rem;
		}
		p {
			font-size: 1.125rem;
			margin-bottom: 2rem;
			opacity: 0.9;
		}
		.icon {
			font-size: 4rem;
			margin-bottom: 1rem;
		}
		button {
			background: white;
			color: #667eea;
			border: none;
			padding: 12px 24px;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s;
		}
		button:hover {
			transform: scale(1.05);
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="icon">📡</div>
		<h1>Ești offline</h1>
		<p>Nu ai conexiune la internet. Unele funcționalități sunt limitate, dar poți accesa datele salvate local.</p>
		<button onclick="window.location.reload()">Încearcă din nou</button>
	</div>
</body>
</html>
